name: test

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} python-${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        rust-version: [stable]
        python-version:
          - '3.7'
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        # skip 3.7 for macos
        exclude:
          - os: macos-latest
            python-version: '3.7'

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.rust-version }}
        override: true

    - name: Cache rust
      uses: Swatinem/rust-cache@v2

    - name: Build and install pycrdt
      run: pip install -e .

    - name: Check types
      if: ${{ matrix.python-version != '3.7' && matrix.python-version != '3.8' && matrix.python-version != '3.9' }}
      run: |
        pip install -e ".[types]"
        mypy python

    - name: Install test dependencies
      run: pip install -e ".[test]"

    - name: Run tests
      if: ${{ !(((matrix.python-version == '3.14') && (matrix.os == 'ubuntu')) || (matrix.python-version == 'pypy3.11')) }}
      run: pytest --color=yes -v tests

    - name: Run tests on PyPy
      if: ${{ (matrix.python-version == 'pypy3.11') }}
      run: pytest --color=yes --ignore tests/test_types.py -v tests

    - name: Run code coverage
      if: ${{ (matrix.python-version == '3.14') && (matrix.os == 'ubuntu') }}
      run: |
        coverage run -m pytest tests
        coverage report --show-missing --fail-under=100
